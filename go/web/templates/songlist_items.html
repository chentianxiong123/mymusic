{{/* 歌单内歌曲片段（Add/Remove/Clear 返回，替换 #songlist-items） */}}
<div class="flex items-center justify-between mb-4 flex-wrap gap-2">
  <div class="flex items-center space-x-3 min-w-0">
    <h2 class="text-lg font-semibold text-gray-900 dark:text-white truncate">{{.Songlist.Name}}</h2>
    <span class="text-sm text-gray-500 dark:text-gray-400 flex-shrink-0">{{.Songlist.Count}} 首</span>
    <button onclick="hcSonglist.rename({{.Songlist.ID}}, {{printf "%q" .Songlist.Name}})"
            class="text-xs text-gray-400 hover:text-pink-400 transition-colors flex-shrink-0" title="重命名">改名</button>
  </div>
  <div class="flex items-center space-x-3 flex-shrink-0">
    {{if .Items}}
    <button onclick="hcBus.emit('play-songlist-all', {id: {{.Songlist.ID}}})"
            class="flex items-center space-x-1 px-3 py-1.5 rounded-full bg-gradient-to-r from-pink-500 to-violet-500 text-white text-sm font-medium shadow-sm hover:brightness-105 transition-all">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <span class="hidden sm:inline">播放全部</span>
    </button>
    <button hx-post="/hx/songlists/clear/{{.Songlist.ID}}" hx-target="#songlist-items" hx-swap="innerHTML" hx-confirm="清空歌单内所有歌曲？"
            class="text-sm text-gray-500 dark:text-gray-400 hover:text-red-500 transition-colors">清空</button>
    {{end}}
  </div>
</div>
{{if not .Items}}
<div class="text-center py-14 text-gray-500 dark:text-gray-400">
  <svg class="w-12 h-12 mx-auto mb-4 text-gray-300 dark:text-gray-600" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6H7v12h2zm8-12v12h2V6h-2z"/></svg>
  <p class="text-lg font-medium">这个歌单还是空的</p>
  <p class="text-sm mt-1">在搜索页或收藏页点歌曲的「更多」→「添加到歌单」</p>
  <a href="/hx/search" hx-get="/hx/search" hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true"
     class="inline-block mt-6 px-5 py-2.5 bg-gradient-to-r from-pink-500 to-violet-500 text-white font-medium rounded-full shadow-md hover:brightness-105 transition-all">去搜索</a>
</div>
{{else}}
<div class="grid gap-3">
  {{range .Items}}
  <div class="group flex items-center space-x-3 sm:space-x-4 p-3 sm:p-4 bg-white dark:bg-gray-800 rounded-2xl min-w-0 shadow-sm hover:shadow-md transition-all duration-200 border border-gray-100 dark:border-gray-700" data-ctx-bvid="{{.BVID}}" data-ctx-title="{{shortTitle .Title}}" data-ctx-full-title="{{.Title}}" data-ctx-artist="{{.Artist}}" data-ctx-cover="{{coverURL .Cover}}" data-ctx-duration="{{.DurationSec}}">
    <div class="relative flex-shrink-0">
      <img src="{{coverURL .Cover}}" alt="{{.Title}}" loading="lazy" referrerpolicy="no-referrer"
           class="w-12 h-9 sm:w-20 sm:h-14 object-cover rounded-xl shadow-sm">
      <button class="hx-play absolute inset-0 bg-black/30 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center cursor-pointer"
              data-bvid="{{.BVID}}" data-title="{{shortTitle .Title}}" data-full-title="{{.Title}}" data-artist="{{.Artist}}" data-cover="{{coverURL .Cover}}" data-duration="{{.DurationSec}}"
              onclick="hcBus.emit('play', {bvid:this.dataset.bvid, title:this.dataset.title, fullTitle:this.dataset.fullTitle, artist:this.dataset.artist, cover:this.dataset.cover, duration:Number(this.dataset.duration)||0})" title="播放">
        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
    <div class="flex-1 min-w-0">
      <h3 class="hx-title text-sm sm:text-lg font-semibold text-gray-900 dark:text-white truncate cursor-pointer hover:text-pink-400 transition-colors"
          data-short="{{shortTitle .Title}}" data-full="{{.Title}}" title="点击展开/收起完整标题">{{shortTitle .Title}}</h3>
      <div class="flex items-center space-x-3 mt-1 text-sm text-gray-500 dark:text-gray-400">
        <span class="truncate max-w-[80px]">{{.Artist}}</span>
        <span>{{.Duration}}</span>
      </div>
    </div>
    <div class="flex items-center space-x-2 flex-shrink-0">
      <button hx-post="/hx/songlists/remove/{{$.Songlist.ID}}/{{.BVID}}" hx-target="#songlist-items" hx-swap="innerHTML"
              class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" title="从歌单移除">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      </button>
      <button class="ctx-more w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
              onclick="this.dispatchEvent(new MouseEvent('contextmenu', {bubbles:true, clientX:event.clientX, clientY:event.clientY}))" title="更多操作">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      </button>
    </div>
  </div>
  {{end}}
</div>
{{end}}
