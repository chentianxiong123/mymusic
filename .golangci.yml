run:
  timeout: 5m
  go: '1.26'  # 对齐 go.mod 声明的 toolchain
  skip-dirs:
    - wails3
    - mygo/build
    - explore
  build-tags:
    - native

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - bodyclose
  disable:
    - depguard
    - revive

linters-settings:
  errcheck:
    exclude-functions:
      - fmt.Fprintf
      - fmt.Fprintln
      - fmt.Fprint

issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck]
    - path: cmd/mock
      linters: [errcheck]
