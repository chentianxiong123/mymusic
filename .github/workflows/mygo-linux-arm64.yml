# mygo Linux arm64 单架构构建 + 发布 —— 永远手动触发。
# 每个架构独立 workflow（避免双架构同 workflow 上传同名文件冲突）。
name: mygo Linux arm64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mygo
      - name: 构建 + 签名 manifest
        working-directory: mygo
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: mygo build -platform linux/arm64
      - name: 发布（create || upload）
        working-directory: mygo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(jq -r .version mygo.json)"
          TAG="v${VER}"
          FILES="$(find build/linux-arm64 -maxdepth 1 -type f \
            \( -name '*linux-arm64*' -o -name '*update-linux*' \
               -o -name '*.deb' -o -name '*.rpm' \) | sort -u)"
          test -n "$FILES" || { echo '无产物'; exit 1; }
          gh release create "$TAG" $FILES --generate-notes --title "MyMusic $VER" 2>/dev/null \
            || gh release upload "$TAG" $FILES --clobber
