# mygo Windows 桌面构建 + 发布（实现方法：windows/amd64）—— 永远手动触发。
# 从 Linux 交叉编译（纯 Go 无 cgo）；windows/amd64 + arm64；tag = v<version>。
name: mygo Windows 构建

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 windows/amd64 + arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mygo
      - name: 构建 + 签名 manifest
        working-directory: mygo
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: mygo build -platform windows/amd64,windows/arm64
      - name: 发布（create || upload）
        working-directory: mygo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(jq -r .version mygo.json)"
          TAG="v${VER}"
          # 只传带架构标识的产物（两目录有 icon.png/install.sh 等同名文件，
          # 一起传会因重复文件名报错退出、导致 arm64 产物漏传）
          FILES="$(find build/windows-amd64 build/windows-arm64 -maxdepth 1 -type f \
            \( -name '*windows-amd64*' -o -name '*windows-arm64*' -o -name '*update-windows*' \
               -o -name '*.exe' \) | sort -u)"
          gh release create "$TAG" $FILES --generate-notes --title "MyMusic $VER" 2>/dev/null \
            || gh release upload "$TAG" $FILES --clobber
