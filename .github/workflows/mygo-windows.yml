# mygo Windows 桌面构建 + 发布（实现方法：windows/amd64）—— 永远手动触发。
# 从 Linux 交叉编译（纯 Go 无 cgo）；windows/amd64 + arm64；tag = v<version>。
name: mygo Windows 构建

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 windows/amd64 + arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mygo
      - name: 构建 + 签名 manifest
        working-directory: mygo
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: mygo build -platform windows/amd64,windows/arm64
      - name: 发布（create || upload）
        working-directory: mygo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(jq -r .version mygo.json)"
          TAG="v${VER}"
          gh release create "$TAG" build/windows-amd64/* build/windows-arm64/* --generate-notes \
            --title "MyMusic $VER" 2>/dev/null \
            || gh release upload "$TAG" build/windows-amd64/* build/windows-arm64/* --clobber
