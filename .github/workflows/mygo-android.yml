# mygo 安卓 APK 构建 + 发布（实现方法：android）—— 永远手动触发。
# v0.10.0 CLI 直编：mobile 分支已删（GitHub 无此 ref），build-android.sh 废弃。
# v0.10.0 自带 internal/mobile/android（android.go/mobilePlatform），-platform android 直出。
# 模板 jvmToolchain(17) → 必须 JDK17（本机实测 Temurin 17）；NDK 28.2；-tags=native 关键。
# 签名：固定 release.keystore（提交 repo）→ apksigner 重签 → 覆盖安装保数据。
name: mygo 安卓构建

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建安卓 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mygo # v0.10.0 CLI（含 android 构建）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # 模板 jvmToolchain(17)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mygo-gradle-${{ runner.os }}-${{ hashFiles('mygo/**') }}
          restore-keys: mygo-gradle-${{ runner.os }}-
      - name: 安装 NDK 28.2 + platform-tools（runner 未必预装 28.2）
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "ndk;28.2.13676358" "platform-tools" | tail -3
      - name: 构建安卓 APK（v0.10.0 CLI 直编）
        env:
          ANDROID_NDK_HOME: $ANDROID_HOME/ndk/28.2.13676358
          ANDROID_NDK_ROOT: $ANDROID_HOME/ndk/28.2.13676358
          GOFLAGS: -mod=mod -tags=native
        run: |
          cd mygo
          mygo build -platform android
      - name: 固定签名 APK（覆盖安装保数据）
        env:
          KEYSTORE_PASS: ${{ secrets.MYGO_ANDROID_KEYSTORE_PASS || 'mymusic-release-2026' }}
        run: |
          set -euo pipefail
          APK="$(ls mygo/build/android/*.apk | head -1)"
          test -n "$APK" || { echo '未找到 APK'; exit 1; }
          BT="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)"
          BT_DIR="$(dirname "$BT")"
          "$BT_DIR/zipalign" -p -f 4 "$APK" /tmp/aligned.apk
          "$BT" sign --ks mygo/android/release.keystore --ks-key-alias mygo \
            --ks-pass "pass:${KEYSTORE_PASS}" --key-pass "pass:${KEYSTORE_PASS}" \
            --out /tmp/mymusic-release.apk /tmp/aligned.apk
          "$BT" verify /tmp/mymusic-release.apk
          mv /tmp/mymusic-release.apk mygo/build/android/mymusic.apk
          ls -lh mygo/build/android/mymusic.apk
      - name: 发布（create || upload）
        run: |
          VER="$(jq -r .version mygo/mygo.json)"
          TAG="v${VER}"
          gh release create "$TAG" mygo/build/android/mymusic.apk --generate-notes \
            --title "MyMusic $VER" 2>/dev/null \
            || gh release upload "$TAG" mygo/build/android/mymusic.apk --clobber
