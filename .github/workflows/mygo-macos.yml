# mygo macOS 构建（Linux 灰色打法）—— 永远手动触发。
# 只构建，不签名不发布：产出**未签名** .app + manifest，供 mygo-sign.yml 签名。
# 灰色打法：Linux 交叉编 .app（纯 Go 无 cgo，免费）。
name: mygo macOS 构建（Linux 灰色）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 .app（Linux 交叉，纯 Go）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mygo
      - name: 构建 darwin arm64 + amd64（.app + manifest，未签名）
        working-directory: mygo
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: mygo build -platform darwin/arm64,darwin/amd64
      - name: 上传 .app（未签名）
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned
          path: |
            mygo/build/darwin-arm64/*.app
            mygo/build/darwin-amd64/*.app
            mygo/build/update-darwin-*.json
