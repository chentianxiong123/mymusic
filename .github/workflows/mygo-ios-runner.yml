# mygo iOS 构建（macos-latest runner 直干）—— 永远手动触发。
# Swift host + Xcode（swiftc/xcrun）全在 macos 上跑；Linux 编不了（Swift 硬墙）。
#
# 两条路（自动按 secret 分流，不需要人工改配置）：
#   ① 配了 MYGO_IOS_TEAM → 真机签名 .ipa（团队证书 + 可选 Provisioning Profile）
#   ② 没配 → ios/simulator 模拟器 .app（ad-hoc 签名，无需 Apple 开发者证书），
#      打包 zip 发 release；普通开发者用 Xcode 模拟器可运行，真机装不了（诚实说明）。
name: mygo iOS 构建（runner）

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（release tag = v<version>）'
        required: false

permissions:
  contents: write

jobs:
  # ── 路①：有 Team ID → 真机签名包 ──
  device:
    name: 真机签名（需 MYGO_IOS_TEAM）
    runs-on: macos-latest
    env:
      HAS_TEAM: ${{ secrets.MYGO_IOS_TEAM != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TEAM == 'yes'
      - uses: ./.github/actions/setup-mygo
        if: env.HAS_TEAM == 'yes'
      - name: 注入 iOS 签名配置
        if: env.HAS_TEAM == 'yes'
        working-directory: mygo
        env:
          IOS_TEAM: ${{ secrets.MYGO_IOS_TEAM }}
          IOS_PROFILE: ${{ secrets.MYGO_IOS_PROFILE }}
        run: |
          set -euo pipefail
          jq --arg t "$IOS_TEAM" --arg p "$IOS_PROFILE" '.ios = {team:$t} + (if $p == "" then {} else {provisioningProfile:$p} end)' mygo.json > /tmp/mygo.json && mv /tmp/mygo.json mygo.json
      - name: 构建 iOS 真机包（Swift host + c-archive + 签名）
        if: env.HAS_TEAM == 'yes'
        working-directory: mygo
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: mygo build -platform ios
      - name: 发布真机包（create || upload）
        if: env.HAS_TEAM == 'yes' && inputs.version != ''
        working-directory: mygo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ github.event.inputs.version }}"
          TAG="v${VER}"
          gh release create "$TAG" build/ios/* \
            --generate-notes --title "MyMusic $VER" 2>/dev/null \
            || gh release upload "$TAG" build/ios/* --clobber

  # ── 路②：无 Team ID → 模拟器包（无需证书，任何人都能构建）──
  simulator:
    name: 模拟器包（无需证书）
    runs-on: macos-latest
    env:
      HAS_TEAM: ${{ secrets.MYGO_IOS_TEAM != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TEAM == 'no'
      - uses: ./.github/actions/setup-mygo
        if: env.HAS_TEAM == 'no'
      - name: 构建 iOS 模拟器包
        if: env.HAS_TEAM == 'no'
        working-directory: mygo
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: mygo build -platform ios/simulator
      - name: 打包 .app 为 zip（文件名带 mygo 前缀，避免与 wails 模拟器包同名）
        if: env.HAS_TEAM == 'no'
        working-directory: mygo
        run: |
          set -euo pipefail
          APP="$(find build/ios -maxdepth 2 -name '*.app' -type d | head -1)"
          test -n "$APP" || { echo '未产出 .app'; find build/ios -maxdepth 3 || true; exit 1; }
          cd "$(dirname "$APP")"
          zip -qr ../../mymusic-ios-simulator-mygo.app.zip "$(basename "$APP")"
          ls -lh ../../mymusic-ios-simulator-mygo.app.zip
      - name: 发布模拟器包（create || upload）
        if: env.HAS_TEAM == 'no' && inputs.version != ''
        working-directory: mygo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ github.event.inputs.version }}"
          TAG="v${VER}"
          gh release create "$TAG" mymusic-ios-simulator-mygo.app.zip \
            --generate-notes --title "MyMusic $VER" 2>/dev/null \
            || gh release upload "$TAG" mymusic-ios-simulator-mygo.app.zip --clobber
