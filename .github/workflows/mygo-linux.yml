# mygo Linux 桌面构建 + 发布（实现方法：linux/amd64）—— 永远手动触发。
# 版本自动从 mygo.json 读（tag = mygo-<version>，与 manifest URL 一致）。
# 发布：首次 gh release create（建 tag+release），已存在则 upload —— 任意触发顺序都行。
name: mygo Linux 构建

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-mygo
      - name: 构建 + 签名 manifest
        working-directory: mygo
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: mygo build -platform linux/amd64
      - name: 发布（create || upload）
        working-directory: mygo
        run: |
          VER="$(jq -r .version mygo.json)"
          TAG="mygo-${VER}"
          gh release create "$TAG" build/linux-amd64/* --generate-notes \
            --title "MyMusic $VER" 2>/dev/null \
            || gh release upload "$TAG" build/linux-amd64/* --clobber
