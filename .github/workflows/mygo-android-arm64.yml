# mygo 安卓 APK 构建 · arm64-v8a（单 ABI）—— 永远手动触发。
# 3 个 ABI 各一个 workflow：mygo build -platform android/arm64 只编一个 .so，
# APK 体积约 1/3。缓存 key 带 ABI 后缀，3 个 CI 互不抢。
# 签名：固定 release.keystore → apksigner 重签 → 覆盖安装保数据。
name: mygo 安卓 arm64-v8a

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建安卓 APK · arm64-v8a
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk # 与 NDK 缓存 path 固定路径一致
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mygo
        with:
          go-cache: 'false' # 自带缓存 key 不带 ABI，3 个 CI 会抢 → 下面自建带 ABI 的
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 缓存①：NDK + platform-tools（3 个 ABI 的 CI 内容完全一样 → 共享 key，只存 1 份）
      - uses: actions/cache@v4
        id: sdk-cache
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/platform-tools
          key: mygo-android-sdk-ndk28.2-v1
      - name: 安装 NDK 28.2 + platform-tools（缓存未命中才下载）
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "ndk;28.2.13676358" "platform-tools" | tail -3
      # 缓存②：Gradle 依赖（与 ABI 无关 → 3 个 CI 共享一份）
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mygo-android-gradle-v1-${{ runner.os }}
          restore-keys: mygo-android-gradle-v1-
      # 缓存③：Go module + build cache（CGO 交叉编译产物按 ABI 不同 → 每 ABI 独立）
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: mygo-android-go-arm64-${{ runner.os }}-${{ hashFiles('mygo/go.sum') }}
          restore-keys: mygo-android-go-arm64-${{ runner.os }}-
      - name: 构建安卓 APK（仅 arm64-v8a）
        env:
          GOFLAGS: -mod=mod -tags=native
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          cd mygo
          mygo build -platform android/arm64
      - name: 固定签名 APK（覆盖安装保数据）
        env:
          KEYSTORE_PASS: ${{ secrets.MYGO_ANDROID_KEYSTORE_PASS || 'mymusic-release-2026' }}
        run: |
          set -euo pipefail
          APK="$(ls mygo/build/android/*.apk | head -1)"
          test -n "$APK" || { echo '未找到 APK'; exit 1; }
          BT="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)"
          BT_DIR="$(dirname "$BT")"
          "$BT_DIR/zipalign" -p -f 4 "$APK" /tmp/aligned.apk
          "$BT" sign --ks mygo/android/release.keystore --ks-key-alias mygo \
            --ks-pass "pass:${{KEYSTORE_PASS}}" --key-pass "pass:${{KEYSTORE_PASS}}" \
            --out /tmp/mymusic-release.apk /tmp/aligned.apk
          "$BT" verify /tmp/mymusic-release.apk
          mv /tmp/mymusic-release.apk mygo/build/android/mymusic-arm64.apk
          ls -lh mygo/build/android/mymusic-arm64.apk
      - name: 发布（create || upload）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(jq -r .version mygo/mygo.json)"
          TAG="v${{VER}}"
          gh release create "$TAG" mygo/build/android/mymusic-arm64.apk --generate-notes \
            --title "MyMusic $VER" 2>/dev/null \
            || gh release upload "$TAG" mygo/build/android/mymusic-arm64.apk --clobber
