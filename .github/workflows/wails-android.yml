# wails 安卓 APK 构建 + 发布（端：android）—— 永远手动触发。
# gradle assembleRelease（jniLibs 预置 libwails.so，无需交叉编 Go）。
# 签名：固定 release.keystore（提交 repo）→ apksigner 重签 → 覆盖安装保数据。
name: wails 安卓构建

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（release tag = v<version>）'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: 构建安卓 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Android SDK 组件（runner 预装 SDK；setup-android@v3 依赖的 `tools` 包已被 Google 下架）
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" | tail -3
      - name: 缓存 Gradle（runner 拉 wrapper 分发容易超时，缓存后不重复下）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
      - name: 安卓 Java 编译 + assembleRelease（LyricOverlayService/MainActivity 等）
        run: |
          cd wails3/build/android
          ./gradlew :app:assembleRelease --no-daemon
      - name: 固定签名 APK（覆盖安装保数据）
        env:
          KEYSTORE_PASS: ${{ secrets.WAILS_ANDROID_KEYSTORE_PASS || 'mymusic-release-2026' }}
        run: |
          set -euo pipefail
          APK="$(find wails3/build/android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$APK" || { echo '未找到 APK'; exit 1; }
          BT="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)"
          BT_DIR="$(dirname "$BT")"
          "$BT_DIR/zipalign" -p -f 4 "$APK" /tmp/aligned.apk
          "$BT" sign --ks wails3/build/android/release.keystore --ks-key-alias mymusic \
            --ks-pass "pass:${KEYSTORE_PASS}" --key-pass "pass:${KEYSTORE_PASS}" \
            --out mymusic-android-arm64.apk /tmp/aligned.apk
          "$BT" verify mymusic-android-arm64.apk
          ls -lh mymusic-android-arm64.apk
      - name: 发布（create || upload）
        run: |
          TAG="v${{ github.event.inputs.version }}"
          gh release create "$TAG" mymusic-android-arm64.apk --generate-notes \
            --title "mymusic ${{ github.event.inputs.version }}" 2>/dev/null \
            || gh release upload "$TAG" mymusic-android-arm64.apk --clobber
