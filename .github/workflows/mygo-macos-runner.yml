# mygo macOS 构建（macos-latest runner 直干）—— 永远手动触发。
# 两套之一：runner 直接编（烧 macos 额度，但最稳）；另一套 mygo-macos.yml = Linux 交叉（免费）。
name: mygo macOS 构建（runner）

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（release tag = mygo-<version>）'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: 构建 macOS（macos runner + Xcode）
    runs-on: macos-latest
    steps:
      - uses: ./.github/actions/setup-mygo
      - name: 构建 darwin arm64 + amd64（含 .app + manifest）
        working-directory: mygo
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: mygo build -platform darwin/arm64,darwin/amd64
      - name: 发布（create || upload）
        if: inputs.version != ''
        working-directory: mygo
        run: |
          VER="${{ github.event.inputs.version }}"
          TAG="mygo-${VER}"
          gh release create "$TAG" build/darwin-arm64/* build/darwin-amd64/* \
            --generate-notes --title "mymusic-mygo $VER" 2>/dev/null \
            || gh release upload "$TAG" build/darwin-arm64/* build/darwin-amd64/* --clobber
